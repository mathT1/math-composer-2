<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시안 다 — 음반</title>
    <style>
      :root {
        --cobalt: #2340c9; /* 재킷 */
        --tangerine: #ff7a2b; /* 켠 음 */
        --lemon: #ffd84a; /* 지금 */
        --ink: #14151a; /* 음반 */
        --paper: #ffffff;
        --mist: #eef0f6;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: #c9cde0; color: var(--ink); font: 500 16px/1.5 'Gothic A1', sans-serif; font-variant-numeric: tabular-nums; }
      .note { max-width: 1280px; margin: 0 auto; padding: 20px 24px; }
      .note h1 { margin: 0 0 4px; font: 400 26px/1.2 'Black Han Sans', sans-serif; }
      .note p { margin: 0; max-width: 60em; }
      .frame { width: 1280px; height: 800px; margin: 0 auto 28px; background: var(--paper); display: grid; grid-template-rows: 60px 1fr; overflow: hidden; }

      /* 곡 순서처럼 늘어선 단계 */
      .tracks { display: flex; align-items: stretch; background: var(--ink); color: #fff; }
      .tracks .work { display: flex; align-items: center; padding: 0 22px; font-weight: 800; background: var(--cobalt); }
      .tracks ol { list-style: none; display: flex; margin: 0; padding: 0; counter-reset: t; flex: 1; }
      .tracks li { counter-increment: t; display: flex; align-items: center; gap: 8px; padding: 0 20px; font-weight: 700; font-size: 17px; color: #b9bccb; }
      .tracks li::before { content: counter(t); font-size: 13px; opacity: 0.7; }
      .tracks li.extra::before { content: '+'; }
      .tracks li[aria-current] { background: var(--lemon); color: var(--ink); }
      .tracks li[aria-current]::before { opacity: 1; }
      .tracks .saved { display: flex; align-items: center; padding: 0 22px; font-size: 14px; color: #b9bccb; }

      .btn { all: unset; min-height: 52px; padding: 0 22px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; font-weight: 800; font-size: 17px; background: var(--ink); color: #fff; text-align: center; }
      .btn.light { background: var(--mist); color: var(--ink); }
      .btn.hot { background: var(--tangerine); color: var(--ink); }
      .cap { font-size: 14px; font-weight: 700; margin: 0 0 6px; }

      /* 분석대: 재킷 한 면 + 뒷면 */
      .bench { display: grid; grid-template-columns: 520px 1fr; min-height: 0; }
      .jacket { background: var(--cobalt); color: #fff; padding: 26px 30px; display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0; position: relative; overflow: hidden; }
      .jacket h3 { margin: 0; font: 400 58px/1 'Black Han Sans', sans-serif; }
      .jacket .hz { font: 400 150px/0.92 'Black Han Sans', sans-serif; letter-spacing: -0.02em; margin-top: 14px; }
      .jacket .hz small { font-size: 44px; margin-left: 8px; }
      .jacket svg { display: block; width: calc(100% + 60px); margin: 0 -30px; height: 100%; min-height: 0; }
      .jacket .say { font-size: 22px; font-weight: 800; }
      .jacket .say b { background: var(--lemon); color: var(--ink); padding: 2px 8px; border-radius: 6px; }
      .back { padding: 22px 28px 24px; display: grid; grid-template-rows: auto 1fr auto auto; gap: 14px; min-height: 0; }
      .chips { display: flex; gap: 8px; }
      .chips span { min-height: 48px; display: inline-flex; align-items: center; padding: 0 18px; border-radius: 24px; background: var(--mist); font-weight: 700; }
      .chips span[aria-current] { background: var(--cobalt); color: #fff; }
      .chips span.add { background: none; border: 2px dashed #8f94ad; }
      .stripes { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; align-items: end; min-height: 0; }
      .stripes div { display: grid; grid-template-rows: 1fr auto; height: 100%; min-height: 0; }
      .stripes i { align-self: end; background: var(--ink); border-radius: 8px 8px 0 0; position: relative; }
      .stripes div:first-child i { background: var(--tangerine); }
      .stripes i b { position: absolute; top: -24px; left: 0; right: 0; text-align: center; font-size: 14px; font-style: normal; }
      .stripes span { text-align: center; font-weight: 800; padding-top: 6px; border-top: 3px solid var(--ink); }
      .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .facts div { background: var(--mist); border-radius: 10px; padding: 10px 14px; }
      .facts b { display: block; font-size: 20px; font-weight: 800; }
      .acts { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }

      /* 작곡실 */
      .studio { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
      .board { padding: 16px 22px 20px 26px; }
      .grid { display: grid; grid-template-columns: 86px repeat(16, 1fr); grid-template-rows: 24px repeat(8, 56px) 60px; gap: 5px; }
      .grid .lab { display: flex; flex-direction: column; justify-content: center; font-weight: 800; font-size: 18px; line-height: 1.1; }
      .grid .lab small { font-size: 13px; font-weight: 500; color: #545a72; }
      .grid .num { font-size: 13px; font-weight: 800; align-self: end; }
      .cell { background: var(--mist); border-radius: 9px; }
      .cell.odd { background: #e2e5f0; }
      .cell.on { background: var(--tangerine); }
      .cell.now { box-shadow: 0 0 0 4px var(--lemon); }
      .cell.now.on { background: var(--ink); }
      .ch { margin-top: 6px; background: var(--cobalt); color: #fff; border-radius: 9px; display: grid; place-items: center; font: 400 24px/1 'Black Han Sans', sans-serif; }
      .ch:empty { background: #d5daf3; }
      .label { background: var(--ink); color: #fff; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
      .label h3 { margin: 0; font: 400 34px/1.05 'Black Han Sans', sans-serif; }
      .label svg { width: 100%; display: block; }
      .label .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .label .seg { min-height: 48px; display: grid; place-items: center; border-radius: 10px; background: #2c2e38; font-weight: 800; }
      .label .seg[aria-current] { background: var(--lemon); color: var(--ink); }
      .label .tempo { font: 400 40px/1 'Black Han Sans', sans-serif; }
      .label .btn.hot { margin-top: auto; }
      .label .btn.light { background: #2c2e38; color: #fff; }
    </style>
  </head>
  <body>
    <div class="note">
      <h1>시안 다. 음반</h1>
      <p>출발점은 음반 한 장입니다. 학생이 만드는 결과물이 음반이라는 생각으로, 측정한 소리는 재킷이 되고 음계는 음반 라벨이 됩니다. 과감하게 쓴 한 곳은 재킷 면의 큰 숫자입니다. 서체는 검은고딕(제목)과 고딕 A1(본문).</p>
    </div>

    <div class="frame">
      <div class="tracks" id="tracks1"></div>
      <div class="bench">
        <div class="jacket">
          <h3>리코더 도</h3>
          <div class="hz">523.9<small>Hz</small></div>
          <svg id="wave" viewBox="0 0 520 190" preserveAspectRatio="none"></svg>
          <div class="say">도5보다 <b>2센트 높음</b></div>
        </div>
        <div class="back">
          <div class="chips"><span aria-current="true">리코더 도</span><span>리코더 솔</span><span>내 목소리</span><span class="add">소리 더 가져오기</span></div>
          <div>
            <p class="cap">배음. 기본음의 몇 배 자리에 얼마나 센 소리가 있는지</p>
            <div class="stripes" id="stripes" style="height: calc(100% - 28px); padding-top: 26px"></div>
          </div>
          <div class="facts">
            <div>주기<b>1.909 ms</b></div>
            <div>측정 신뢰도<b>높음</b></div>
            <div>가장 센 배음<b>2배음 42%</b></div>
          </div>
          <div class="acts"><button class="btn light">구간 다시 고르기</button><button class="btn hot">이 소리를 내 음색으로 쓰기</button></div>
        </div>
      </div>
    </div>

    <div class="frame">
      <div class="tracks" id="tracks2"></div>
      <div class="studio">
        <div class="board"><div class="grid" id="grid"></div></div>
        <div class="label">
          <h3>첫 번째 곡</h3>
          <svg id="disc" viewBox="0 0 252 252"></svg>
          <div><p class="cap">빠르기</p><div class="tempo">96</div></div>
          <div class="row"><div class="seg" aria-current="true">1~4마디</div><div class="seg">5~8마디</div></div>
          <button class="btn hot">처음부터 듣기</button>
          <button class="btn light">방금 한 것 되돌리기</button>
        </div>
      </div>
    </div>

    <script type="module">
      import '@fontsource/black-han-sans/400.css';
      import '@fontsource/gothic-a1/500.css';
      import '@fontsource/gothic-a1/700.css';
      import '@fontsource/gothic-a1/800.css';
      import { $, chords, melody, playhead, scale, sound, stages, stepHz, wavePath } from './shared.ts';

      const tracks = (current) =>
        `<div class="work">김하늘의 작업</div><ol>${stages
          .map((s) => `<li ${s === current ? 'aria-current="step"' : ''}>${s}</li>`)
          .join('')}<li class="extra">심화</li></ol><div class="saved">10시 42분에 저장됨</div>`;
      $('tracks1').innerHTML = tracks('보기');
      $('tracks2').innerHTML = tracks('만들기');

      $('wave').innerHTML =
        `<rect x="150" y="6" width="210" height="178" rx="10" fill="#ffffff" fill-opacity=".14"/>` +
        `<path d="${wavePath(520, 190, 8)}" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>` +
        `<rect x="140" y="64" width="20" height="62" rx="6" fill="#ffd84a"/><rect x="350" y="64" width="20" height="62" rx="6" fill="#ffd84a"/>`;

      $('stripes').innerHTML = sound.harmonics
        .map((a, k) => `<div><i style="height:${Math.max(3, a * 100)}%"><b>${k < 4 ? Math.round((k + 1) * sound.f0) : ''}</b></i><span>${k + 1}배</span></div>`)
        .join('');

      // 음계를 음반 라벨로: 한 바퀴가 한 옥타브
      const cx = 126, cy = 126;
      let d = `<circle cx="${cx}" cy="${cy}" r="124" fill="#2c2e38"/>`;
      for (const rr of [112, 100, 88]) d += `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="#14151a" stroke-width="1.5"/>`;
      d += `<circle cx="${cx}" cy="${cy}" r="72" fill="#2340c9"/>`;
      for (let k = 0; k < 12; k++) {
        const a = (k / 12) * 2 * Math.PI - Math.PI / 2;
        d += `<line x1="${cx + 72 * Math.cos(a)}" y1="${cy + 72 * Math.sin(a)}" x2="${cx + 80 * Math.cos(a)}" y2="${cy + 80 * Math.sin(a)}" stroke="#8f94ad" stroke-width="2"/>`;
      }
      scale.steps.slice(0, 7).forEach((st) => {
        const a = (st.cents / 1200) * 2 * Math.PI - Math.PI / 2;
        d += `<circle cx="${cx + 98 * Math.cos(a)}" cy="${cy + 98 * Math.sin(a)}" r="15" fill="#ff7a2b"/>`;
        d += `<text x="${cx + 98 * Math.cos(a)}" y="${cy + 98 * Math.sin(a) + 5.5}" text-anchor="middle" font-size="15" font-weight="800" fill="#14151a">${st.label}</text>`;
      });
      d += `<text x="${cx}" y="${cy - 6}" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">순정률</text><text x="${cx}" y="${cy + 16}" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">장음계</text><circle cx="${cx}" cy="${cy + 44}" r="5" fill="#14151a"/>`;
      $('disc').innerHTML = d;

      let html = '<div></div>';
      for (let c = 0; c < 16; c++) html += `<div class="num">${c % 4 === 0 ? c / 4 + 1 + '마디' : ''}</div>`;
      for (let row = scale.steps.length - 1; row >= 0; row--) {
        html += `<div class="lab">${scale.steps[row].label}<small>${stepHz(row).toFixed(1)} Hz</small></div>`;
        for (let c = 0; c < 16; c++)
          html += `<div class="cell${Math.floor(c / 4) % 2 ? ' odd' : ''}${melody[c] === row ? ' on' : ''}${c === playhead ? ' now' : ''}"></div>`;
      }
      html += '<div class="lab" style="margin-top:6px">화음</div>';
      for (let c = 0; c < 16; c++) html += `<div class="ch">${chords[c]}</div>`;
      $('grid').innerHTML = html;
    </script>
  </body>
</html>
